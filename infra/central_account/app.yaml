AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SAS WAF Security Platform - central security account, application stack: FastAPI on ECS Fargate behind an ALB
  (protected by AWS WAF, reachable only through CloudFront), the React SPA from a private S3 bucket via CloudFront,
  and the TTL-expiry worker as a scheduled Fargate task. Imports networking/data outputs from platform.yaml.

Parameters:
  EnvironmentName:
    Type: String
    Default: sas-waf-prod
    Description: Must match the platform stack's EnvironmentName (export prefix).
  ImageUri:
    Type: String
    Description: Backend image (backend/Dockerfile) in ECR, pinned by tag or digest.
  AlbCertificateArn:
    Type: String
    Description: ACM certificate (this region) for the ALB HTTPS listener, used by CloudFront origin TLS.
  AlbOriginDomain:
    Type: String
    Description: DNS name covered by AlbCertificateArn that points (CNAME/alias) at the ALB, e.g. origin.waf.example.com.
  CloudFrontAliases:
    Type: CommaDelimitedList
    Default: ""
    Description: Optional viewer hostnames, e.g. waf.example.com (requires CloudFrontCertificateArn in us-east-1).
  CloudFrontCertificateArn:
    Type: String
    Default: ""
  OidcIssuer:
    Type: String
  OidcClientId:
    Type: String
  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
  TaskCpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024"]
  TaskMemory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048"]

Conditions:
  HasAlias: !Not [!Equals [!Join ["", !Ref CloudFrontAliases], ""]]

Resources:
  # --- ALB (only CloudFront may reach it: shared secret header) -------------------------------------------
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/cloudfront/origin-verify"
      Description: Value CloudFront adds as X-Origin-Verify; the ALB rejects requests without it.
      GenerateSecretString: {PasswordLength: 48, ExcludePunctuation: true}

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Platform ALB (HTTPS from CloudFront; header-verified)
      VpcId: {"Fn::ImportValue": !Sub "${EnvironmentName}-VpcId"}
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: CloudFront origin fetches}

  AppIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: {"Fn::ImportValue": !Sub "${EnvironmentName}-AppSecurityGroupId"}
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: ALB to FastAPI

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !Split [",", {"Fn::ImportValue": !Sub "${EnvironmentName}-PublicSubnets"}]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: "300"}  # WebSocket /ws/events
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: "true"}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: {"Fn::ImportValue": !Sub "${EnvironmentName}-VpcId"}
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "30"}

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref AlbCertificateArn}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: "403", ContentType: text/plain, MessageBody: Forbidden}

  FromCloudFrontRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Sub "{{resolve:secretsmanager:${OriginVerifySecret}}}"]
      Actions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}

  AlbWebAcl:  # the platform protects itself with the same controls it audits
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${EnvironmentName}-platform-alb"
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: platformAlb}
      Rules:
        - Name: AWS-AWSManagedRulesAmazonIpReputationList
          Priority: 0
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ipReputation}
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common}
        - Name: AWS-AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: badInputs}
        - Name: RateLimitPerIp
          Priority: 3
          Action: {Block: {}}
          Statement: {RateBasedStatement: {Limit: 2000, AggregateKeyType: FORWARDED_IP,
                                           ForwardedIPConfig: {HeaderName: X-Forwarded-For, FallbackBehavior: MATCH}}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rateLimit}

  AlbWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt AlbWebAcl.Arn

  # --- ECS --------------------------------------------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${EnvironmentName}-api"
      ClusterSettings: [{Name: containerInsights, Value: disabled}]  # cost; ALB + app logs cover the SLOs

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/ecs/${EnvironmentName}-api", RetentionInDays: 30}

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: task-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - {"Fn::ImportValue": !Sub "${EnvironmentName}-DatabaseSecretArn"}
                  - {"Fn::ImportValue": !Sub "${EnvironmentName}-ResponseExternalIdSecretArn"}
                  - {"Fn::ImportValue": !Sub "${EnvironmentName}-OidcClientSecretArn"}
              - Effect: Allow
                Action: kms:Decrypt
                Resource: {"Fn::ImportValue": !Sub "${EnvironmentName}-DataKeyArn"}

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SASFastAPIResponseExecutorRole  # the only principal SASWafResponseRole trusts (StackSet)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      Policies:
        - PolicyName: controlled-response
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AssumeResponseRoleWithApprovalContext
                Effect: Allow
                Action: [sts:AssumeRole, sts:TagSession, sts:SetSourceIdentity]
                Resource: !Sub "arn:${AWS::Partition}:iam::*:role/SASWafResponseRole"
              - Effect: Allow
                Action: sns:Publish
                Resource: {"Fn::ImportValue": !Sub "${EnvironmentName}-ApprovalTopicArn"}
              - Effect: Allow
                Action: [states:StartExecution, states:DescribeExecution]
                Resource:
                  - {"Fn::ImportValue": !Sub "${EnvironmentName}-SyncStateMachineArn"}
                  - !Sub
                    - "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${Name}:*"
                    - Name: !Sub "${EnvironmentName}-SAS-39Account-Sync"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-api"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          PortMappings: [{ContainerPort: 8000, Protocol: tcp}]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          Environment:
            - {Name: SAS_ENVIRONMENT, Value: production}
            - {Name: SAS_AWS_REGION, Value: !Ref AWS::Region}
            - {Name: SAS_DB_HOST, Value: {"Fn::ImportValue": !Sub "${EnvironmentName}-DatabaseEndpoint"}}
            - {Name: SAS_DB_NAME, Value: sas_waf}
            - {Name: SAS_REDIS_URL, Value: {"Fn::ImportValue": !Sub "${EnvironmentName}-RedisUrl"}}
            - {Name: SAS_SNS_TOPIC_ARN, Value: {"Fn::ImportValue": !Sub "${EnvironmentName}-ApprovalTopicArn"}}
            - {Name: SAS_SYNC_STATE_MACHINE_ARN, Value: {"Fn::ImportValue": !Sub "${EnvironmentName}-SyncStateMachineArn"}}
            - {Name: SAS_OIDC_ISSUER, Value: !Ref OidcIssuer}
            - {Name: SAS_OIDC_CLIENT_ID, Value: !Ref OidcClientId}
            - Name: SAS_FRONTEND_URL
              Value: !Sub
                - "https://${Domain}"
                - Domain: !If [HasAlias, !Select [0, !Ref CloudFrontAliases], !GetAtt Distribution.DomainName]
            - Name: SAS_CORS_ORIGINS
              Value: !Sub
                - '["https://${Domain}"]'
                - Domain: !If [HasAlias, !Select [0, !Ref CloudFrontAliases], !GetAtt Distribution.DomainName]
            - Name: SAS_OIDC_REDIRECT_URI
              Value: !Sub
                - "https://${Domain}/api/v1/auth/callback"
                - Domain: !If [HasAlias, !Select [0, !Ref CloudFrontAliases], !GetAtt Distribution.DomainName]
          Secrets:
            - Name: SAS_DB_USER
              ValueFrom: !Sub
                - "${Arn}:username::"
                - Arn: {"Fn::ImportValue": !Sub "${EnvironmentName}-DatabaseSecretArn"}
            - Name: SAS_DB_PASSWORD
              ValueFrom: !Sub
                - "${Arn}:password::"
                - Arn: {"Fn::ImportValue": !Sub "${EnvironmentName}-DatabaseSecretArn"}
            - Name: SAS_RESPONSE_EXTERNAL_ID
              ValueFrom: {"Fn::ImportValue": !Sub "${EnvironmentName}-ResponseExternalIdSecretArn"}
            - Name: SAS_OIDC_CLIENT_SECRET
              ValueFrom: {"Fn::ImportValue": !Sub "${EnvironmentName}-OidcClientSecretArn"}

  Service:
    Type: AWS::ECS::Service
    DependsOn: FromCloudFrontRule
    Properties:
      ServiceName: !Sub "${EnvironmentName}-api"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [",", {"Fn::ImportValue": !Sub "${EnvironmentName}-AppSubnets"}]
          SecurityGroups: [{"Fn::ImportValue": !Sub "${EnvironmentName}-AppSecurityGroupId"}]
      LoadBalancers:
        - {ContainerName: api, ContainerPort: 8000, TargetGroupArn: !Ref TargetGroup}

  # --- TTL expiry worker (app/workers/ttl_expiry.py) every 5 minutes ----------------------------------------
  TtlWorkerEventsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: events.amazonaws.com}, Action: sts:AssumeRole}
      Policies:
        - PolicyName: run-ttl-task
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref TaskDefinition
                Condition: {ArnEquals: {ecs:cluster: !GetAtt Cluster.Arn}}
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt TaskExecutionRole.Arn, !GetAtt TaskRole.Arn]

  TtlExpirySchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-ttl-expiry"
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: ttl-expiry
          Arn: !GetAtt Cluster.Arn
          RoleArn: !GetAtt TtlWorkerEventsRole.Arn
          Input: '{"containerOverrides": [{"name": "api", "command": ["python", "-m", "app.workers.ttl_expiry"]}]}'
          EcsParameters:
            TaskDefinitionArn: !Ref TaskDefinition
            LaunchType: FARGATE
            TaskCount: 1
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: DISABLED
                Subnets: !Split [",", {"Fn::ImportValue": !Sub "${EnvironmentName}-AppSubnets"}]
                SecurityGroups: [{"Fn::ImportValue": !Sub "${EnvironmentName}-AppSecurityGroupId"}]

  # --- SPA + CloudFront ---------------------------------------------------------------------------------------
  SpaBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}

  SpaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SpaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${SpaBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SpaBucket.Arn, !Sub "${SpaBucket.Arn}/*"]
            Condition: {Bool: {aws:SecureTransport: "false"}}

  SpaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${EnvironmentName}-spa"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRouting:  # client-side routes -> index.html, without masking API 403/404s (unlike CustomErrorResponses)
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${EnvironmentName}-spa-routing"
      AutoPublish: true
      FunctionConfig: {Comment: SPA deep links to index.html, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (!request.uri.includes('.')) { request.uri = '/index.html'; }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${EnvironmentName} SOC console"
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [HasAlias, !Ref CloudFrontAliases, !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasAlias
          - {AcmCertificateArn: !Ref CloudFrontCertificateArn, SslSupportMethod: sni-only,
             MinimumProtocolVersion: TLSv1.2_2021}
          - {CloudFrontDefaultCertificate: true}
        Origins:
          - Id: spa
            DomainName: !GetAtt SpaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SpaOriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ""}
          - Id: api
            DomainName: !Ref AlbOriginDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub "{{resolve:secretsmanager:${OriginVerifySecret}}}"
        DefaultCacheBehavior:
          TargetOriginId: spa
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - {EventType: viewer-request, FunctionARN: !GetAtt SpaRouting.FunctionMetadata.FunctionARN}
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
          - PathPattern: /ws/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

Outputs:
  ConsoleUrl:
    Value: !Sub
      - "https://${Domain}"
      - Domain: !If [HasAlias, !Select [0, !Ref CloudFrontAliases], !GetAtt Distribution.DomainName]
  DistributionId:
    Value: !Ref Distribution
  SpaBucketName:
    Value: !Ref SpaBucket
  AlbDnsName:
    Description: Point AlbOriginDomain (CNAME/alias) here.
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  TaskDefinitionArn:
    Description: Use for the one-off `alembic upgrade head` migration task (see infra/README.md).
    Value: !Ref TaskDefinition
